name: shsw

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: ./api
    image: shsw-api:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      SHSW_INTERNAL_TOKEN: ${SHSW_INTERNAL_TOKEN:?set SHSW_INTERNAL_TOKEN in .env}
      SHSW_PUBLIC_URL: ${SHSW_PUBLIC_URL:-}
    ports:
      # 管理 API。フロントエンド・トリガー呼び出し元から到達できるアドレスで公開する
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - shsw-data:/data
      - shsw-certs:/certs
    logging: *default-logging

  proxy:
    # rama (Rust) で実装した MITM プロキシ。proxy/ を参照
    build: ./proxy
    image: shsw-proxy:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      SHSW_API_URL: http://api:8000
      SHSW_INTERNAL_TOKEN: ${SHSW_INTERNAL_TOKEN:?set SHSW_INTERNAL_TOKEN in .env}
      SHSW_CERT_DIR: /certs
      SHSW_LISTEN: 0.0.0.0:8080
      # 例: user:pass を指定するとプロキシ認証 (Basic) を要求
      SHSW_PROXY_AUTH: ${PROXY_AUTH:-}
      # true にするとプライベート IP / Tailscale 以外のクライアントも受け付ける(認証必須で)
      SHSW_ALLOW_PUBLIC_CLIENTS: ${PROXY_ALLOW_PUBLIC_CLIENTS:-false}
      # ログレベル (error/warn/info/debug)。モジュール単位の指定も可 (例 info,rama=warn)
      SHSW_LOG: ${PROXY_LOG_LEVEL:-info}
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-8080}:8080"
    volumes:
      - shsw-certs:/certs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 15s
    logging: *default-logging

volumes:
  shsw-data:
  shsw-certs:
