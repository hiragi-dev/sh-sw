[package]
name = "shsw-proxy"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
description = "shsw MITM access-control proxy built on rama"
publish = false

[dependencies]
rama = { version = "=0.4.0", features = ["http-full", "boring"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
arc-swap = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
nix = { version = "0.30", features = ["socket", "net"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
